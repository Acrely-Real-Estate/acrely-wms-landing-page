<!DOCTYPE html>
<html>
<head>
<style>
  .header {
    position: sticky;
    top: 0;
    height: 64px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(4px); /* This creates a containing block */
    border-bottom: 1px solid #ccc;
    z-index: 100;
  }
  .drawer {
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    background: red;
  }
</style>
</head>
<body>
  <header class="header">
    <div class="drawer"></div>
  </header>
</body>
</html>
